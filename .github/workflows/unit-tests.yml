name: Unit tests

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Gradle --tests filter (empty = all)"
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: |
          chmod +x gradlew
          FILTER="${{ inputs.tests }}"
          ./gradlew testStandardDebugUnitTest ${FILTER:+--tests "$FILTER"} --continue
      - name: Summarize
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          tot = fail = 0; lines = []
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(f).getroot()
              for tc in r.iter("testcase"):
                  tot += 1
                  bad = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  if bad is not None:
                      fail += 1; lines.append(f"- ❌ `{tc.get('classname')}.{tc.get('name')}`: {(bad.get('message') or '')[:200]}")
          print(f"**{tot - fail}/{tot} tests passed**\n"); print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests
