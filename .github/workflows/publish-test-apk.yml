name: Publish test APK

# Builds the debug APK and attaches it to the "test-build" pre-release, so it can be downloaded
# straight from a phone (artifacts need a GitHub login and come zipped).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardDebug
          mkdir -p out
          for f in $(find app/build/outputs/apk -name '*.apk'); do cp "$f" "out/$(basename "$f" .apk)-${GITHUB_SHA::7}.apk"; done
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=test-build
          NOTES="Debug build of $GITHUB_SHA ($(date -u +%Y-%m-%d)). Installs as a separate app (package ...debug) next to the regular LeanType."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            for a in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" -y
            done
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Test build" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" out/*.apk
